<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הכנה למבחני מנהל עבודה בבנייה</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f3f4f6;
        }
        
        .construction-pattern {
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 215, 0, 0.1) 10px,
                rgba(255, 215, 0, 0.1) 20px
            );
        }

        .option-card {
            transition: all 0.2s ease-in-out;
        }
        
        .option-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen construction-pattern flex flex-col items-center justify-center p-4">

    <!-- מסך הרשמה ותשלום (המסך הראשון) -->
    <div id="register-screen" class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden border-t-8 border-yellow-400">
        <div class="p-8 text-center bg-gray-900 text-white">
            <h1 class="text-3xl font-bold mb-2 text-yellow-400">מנהל עבודה בבנייה</h1>
            <p class="text-gray-300">הכנה מקצועית למבחני ההסמכה</p>
        </div>
        
        <div class="p-8">
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">שם מלא</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-lg bg-gray-100 border-gray-300 focus:border-yellow-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400 transition-colors">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">אימייל</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-lg bg-gray-100 border-gray-300 focus:border-yellow-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400 transition-colors">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">מספר טלפון</label>
                    <input type="tel" id="reg-phone" required class="w-full px-4 py-3 rounded-lg bg-gray-100 border-gray-300 focus:border-yellow-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400 transition-colors">
                </div>
                
                <button type="submit" class="w-full bg-[#00d0df] hover:bg-[#00b5c2] text-white font-bold py-3 px-4 rounded-lg focus:outline-none transition-colors mt-6 flex justify-center items-center gap-2 text-lg shadow-md">
                    <span>תשלום ב-bit</span>
                </button>
            </form>
            
            <div class="mt-6 text-center border-t pt-4">
                <p class="text-sm text-gray-600 mb-2">כבר רכשת פרטי התחברות?</p>
                <button onclick="showScreen('login-screen')" class="text-gray-900 font-bold hover:text-yellow-600 underline">התחבר כאן</button>
            </div>
        </div>
    </div>

    <!-- מסך התחברות (למי שכבר יש לו משתמש) -->
    <div id="login-screen" class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden border-t-8 border-gray-900 hidden">
        <div class="p-8 text-center bg-yellow-400 text-gray-900">
            <h1 class="text-3xl font-bold mb-2">התחברות למערכת</h1>
            <p class="text-gray-800">הכנס את הפרטים שקיבלת</p>
        </div>
        
        <div class="p-8">
            <div id="login-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center font-bold">
                שם משתמש או סיסמה שגויים
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">שם משתמש</label>
                    <input type="text" id="username" class="w-full px-4 py-3 rounded-lg bg-gray-100 border-gray-300 focus:border-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gray-900 transition-colors">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">סיסמה</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-lg bg-gray-100 border-gray-300 focus:border-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gray-900 transition-colors">
                </div>
                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 px-4 rounded-lg focus:outline-none transition-colors mt-6">
                    היכנס למבחן
                </button>
            </form>
            
            <div class="mt-6 text-center border-t pt-4">
                <button onclick="showScreen('register-screen')" class="text-sm text-gray-600 hover:text-gray-900 underline">חזור למסך ההרשמה והתשלום</button>
            </div>
        </div>
    </div>

    <!-- מסך המבחן -->
    <div id="quiz-screen" class="w-full max-w-3xl bg-white rounded-xl shadow-2xl overflow-hidden hidden">
        <div class="p-6 bg-gray-900 text-white flex justify-between items-center border-b-4 border-yellow-400">
            <h2 class="text-2xl font-bold">מבחן תרגול לדוגמה</h2>
            <div class="text-yellow-400 font-bold bg-gray-800 px-4 py-2 rounded-lg">
                שאלה <span id="current-q-num">1</span> מתוך <span id="total-q-num">3</span>
            </div>
        </div>
        
        <div class="p-8">
            <h3 id="question-text" class="text-xl font-bold text-gray-800 mb-6 leading-relaxed"></h3>
            
            <div id="options-container" class="space-y-4">
                <!-- האפשרויות יוזרקו לכאן דרך JS -->
            </div>
            
            <button id="next-btn" class="hidden mt-8 w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-4 rounded-lg transition-colors">
                המשך לשאלה הבאה
            </button>
        </div>
    </div>

    <!-- מסך תוצאות -->
    <div id="results-screen" class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden text-center hidden">
        <div class="p-8 bg-gray-900 text-white">
            <h2 class="text-3xl font-bold text-yellow-400 mb-2">סיום המבחן!</h2>
            <p>הנה התוצאות שלך</p>
        </div>
        <div class="p-8">
            <div class="text-6xl font-bold text-gray-900 mb-4" id="score-display"></div>
            <p class="text-lg text-gray-600 mb-8" id="score-message"></p>
            
            <button onclick="location.reload()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 px-4 rounded-lg transition-colors">
                חזור למסך הראשי
            </button>
        </div>
    </div>

    <script>
        // דאטה של המבחן - 3 שאלות לדוגמה
        const questions = [
            {
                question: "על פי תקנות הבטיחות בעבודה, מאיזה גובה יש להתקין מעקות בפיגומים?",
                options: [
                    "מגובה של 1.0 מטר",
                    "מגובה של 2.0 מטר",
                    "מגובה של 1.5 מטר",
                    "מגובה של 3.0 מטר"
                ],
                correctAnswer: 1 // אינדקס של התשובה הנכונה (התשובה השנייה)
            },
            {
                question: "מהו תפקידו העיקרי של מנהל עבודה ביום יציקת בטון?",
                options: [
                    "לוודא את איכות הבטון המגיע ולהזמין בדיקת מעבדה מוסמכת",
                    "לנהג את משאית הבטון בתוך אתר הבנייה",
                    "לשלם לספק הבטון את יתרת החוב",
                    "להכין את תוכניות הקונסטרוקציה למהנדס"
                ],
                correctAnswer: 0
            },
            {
                question: "מי מוסמך לבדוק עגורן צריח לאחר הקמתו ולפני תחילת עבודתו?",
                options: [
                    "מנהל העבודה באתר",
                    "מפקח בנייה מטעם הרשות המקומית",
                    "בודק מוסמך שמונה על ידי משרד העבודה",
                    "מהנדס הקונסטרוקציה של הפרויקט"
                ],
                correctAnswer: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        // פונקציית מעבר בין מסכים
        function showScreen(screenId) {
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
        }

        // טיפול בטופס ההרשמה והתשלום בביט
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault(); // מונע רענון של העמוד
            
            const name = document.getElementById('reg-name').value;
            // כאן אפשר יהיה בעתיד לשמור את הפרטים
            
            alert(`שלום ${name},\nמערכת התשלומים של bit עדיין לא מחוברת.\nבקרוב נוסיף את אפשרות הסליקה!`);
        });

        // טיפול בהתחברות למערכת
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // לוגיקה זמנית: שם משתמש user1 וסיסמה 1234
            if (user === 'user1' && pass === '1234') {
                showScreen('quiz-screen');
                loadQuestion();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        // טעינת שאלה
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            document.getElementById('next-btn').classList.add('hidden');
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-card w-full text-right p-4 rounded-lg border-2 border-gray-200 bg-gray-50 hover:border-yellow-400 hover:bg-yellow-50 text-gray-800 font-semibold focus:outline-none';
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        // בחירת תשובה
        function selectOption(selectedIndex, btnElement) {
            const q = questions[currentQuestion];
            const allButtons = document.getElementById('options-container').children;
            
            // ניטרול לחיצות נוספות
            for(let btn of allButtons) {
                btn.onclick = null;
                btn.classList.remove('hover:border-yellow-400', 'hover:bg-yellow-50');
            }
            
            if (selectedIndex === q.correctAnswer) {
                btnElement.classList.remove('border-gray-200', 'bg-gray-50');
                btnElement.classList.add('border-green-500', 'bg-green-100', 'text-green-800');
                score++;
            } else {
                btnElement.classList.remove('border-gray-200', 'bg-gray-50');
                btnElement.classList.add('border-red-500', 'bg-red-100', 'text-red-800');
                
                // סימון התשובה הנכונה
                allButtons[q.correctAnswer].classList.remove('border-gray-200', 'bg-gray-50');
                allButtons[q.correctAnswer].classList.add('border-green-500', 'bg-green-100');
            }
            
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // מעבר לשאלה הבאה
        document.getElementById('next-btn').addEventListener('click', () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        // מסך תוצאות
        function showResults() {
            showScreen('results-screen');
            const finalScore = Math.round((score / questions.length) * 100);
            document.getElementById('score-display').innerText = finalScore;
            
            let message = "";
            if(finalScore >= 70) {
                message = "כל הכבוד! עברת את התרגול בהצלחה.";
                document.getElementById('score-display').classList.add('text-green-600');
            } else {
                message = "לא נורא, כדאי לחזור על החומר ולנסות שוב.";
                document.getElementById('score-display').classList.add('text-red-600');
            }
            document.getElementById('score-message').innerText = message;
        }
    </script>
</body>
</html>
